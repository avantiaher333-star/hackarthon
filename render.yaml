services:
  - type: web
    name: roadsense-ai
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/run.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: backend
      - key: PORT
        value: 10000

